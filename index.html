<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Авторизация</title>
  <style>
    body {
      background-color: #ffe6e6;
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      padding: 50px;
      transition: background-color 0.6s;
    }
    .card {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      max-width: 500px;
      margin: auto;
      transition: opacity 0.5s;
    }
    h1 {
      color: #e60073;
    }
    input {
      width: 70%;
      padding: 10px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }
    .hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    .error {
      color: red;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- Первая страница (аутентификация) -->
  <div id="page1" class="card">
    <h1>Введите кодовое слово</h1>
    <input id="inputCode" type="text" placeholder="Введите сюда"><br><br>
    <p class="error" id="error"></p>
    <p><small>Введите код и нажмите Enter</small></p>
  </div>

  <!-- Вторая страница (пароль) -->
  <div id="page2" class="card hidden">
    <h1>Ваш пароль:XCdefwkjnedk23</h1>
    <p style="font-size:22px; color:#0066cc; font-weight:bold;">Xdowfjmoi23</p>
  </div>

  <script>
    const input = document.getElementById('inputCode');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const error = document.getElementById('error');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (input.value.trim().toUpperCase() === 'RAFAEL') {
          // показать вторую страницу
          page1.classList.add('hidden');
          page2.classList.remove('hidden');
          document.body.style.backgroundColor = '#e6f7ff';
        } else {
          error.textContent = 'Неверно!';
        }
      }
    });
  </script>
</body>
</html>
